[project]
name = "reliefnet"
version = "0.1.0"
description = "Multi-agent flood relief coordination on a shared FalkorDB memory graph"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "falkordb>=1.0.10",
  "redis>=5.0",
  "anthropic>=1.14",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "rapidfuzz>=3.9",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
embed = ["fastembed>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reliefnet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
